[technology-description]
asteroid-bioprocessing=Enables advanced biological processes that allows for decomposing asteroids into usefull materials.
organic-decomposition=Enables advanced biological processes to trigger controlled rotting and decompose agricultural products into spoilage.
lithic-decomposition=Utilizes specialized bacteria to leach and erode minerals, breaking down solid stones and raw ores into fine, highly reactive dust.
exotic-lithic-decomposition=Utilizes specialized bacteria to leach and erode exotic metals, breaking down solid raw ores into fine, highly reactive dust.
organic-sludge-processing=Advanced processing of bulk rot into dense fluid organic slurry, allowing for highly efficient spoilage transport.
improvised-landfill=Create makeshift landfill structures from available materials.
